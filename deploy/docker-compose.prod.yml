version: '3.8'

services:
  # Database Tier
  postgres:
    image: postgres:15-alpine
    container_name: pixel-todo-db
    environment:
      POSTGRES_DB: pixel_todo
      POSTGRES_USER: pixel_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pixel_pass_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d
    networks:
      - pixel-todo-network
    restart: unless-stopped

  # Application Tier
  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/pixel-todo-backend:latest
    container_name: pixel-todo-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pixel_user:${DB_PASSWORD:-pixel_pass_prod}@postgres:5432/pixel_todo
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - pixel-todo-network
    restart: unless-stopped

  # Presentation Tier
  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/pixel-todo-frontend:latest
    container_name: pixel-todo-web
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pixel-todo-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  pixel-todo-network:
    driver: bridge