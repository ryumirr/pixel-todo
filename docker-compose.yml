version: '3.8'

services:
  # Database Tier
  postgres:
    image: postgres:15-alpine
    container_name: pixel-todo-db
    environment:
      POSTGRES_DB: pixel_todo
      POSTGRES_USER: pixel_user
      POSTGRES_PASSWORD: pixel_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - pixel-todo-network

  # Application Tier
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixel-todo-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pixel_user:pixel_pass@postgres:5432/pixel_todo
      JWT_SECRET: your-jwt-secret-key
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - pixel-todo-network

  # Presentation Tier
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pixel-todo-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pixel-todo-network

volumes:
  postgres_data:

networks:
  pixel-todo-network:
    driver: bridge